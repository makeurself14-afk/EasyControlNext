name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build server
        working-directory: easycontrolnext
        run: ./gradlew assembleDebug -p server

      - name: Copy server into app
        working-directory: easycontrolnext
        run: ./gradlew copyDebug -p server

      - name: Build app
        working-directory: easycontrolnext
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyControlNext-debug
          path: easycontrolnext/app/build/outputs/apk/debug/*.apk

